[package]
name = "xmip-core-transport-msmq"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-msmq"
description = "MSMQ transport: one message is one Stream, carried as an SRMP envelope with its body attached over the HTTP transport MSMQ uses between machines. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26), and the one clock
# (xcore::Clock) an envelope's time is read from.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# The carrier the manifest names: MSMQ between machines is a POST. The
# code's alone: the declaration takes no setting from it.
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main", optional = true }
# HTTP/1.1 on the wire (`net::http`) and the URL an endpoint is
# (`net::Endpoint`): the one codec every technology riding on HTTP calls.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }

[lints]
workspace = true

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:codec", "dep:http", "dep:net"]
# The declaration alone.
declaration = []
# HTTPS, through http's endpoint and so xmip-core-library-tls (ADR-0033):
# a guarded queue (msmqs://, https://, DIRECT=HTTPS://) is sent over it, and
# without the feature is refused rather than written in the clear; the
# technology's code, so the default with it.
tls = ["default", "http/tls"]
